name: Build YEJI SOLUTION Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\source\craftmaster.ini
      SOURCE_DIR: ${{ github.workspace }}\source
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Expand branded source
        shell: pwsh
        run: |
          git clone --quiet --depth=1 --branch v34.0.2 https://github.com/nextcloud/desktop.git "${{ env.SOURCE_DIR }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Keep the official Nextcloud source and branding intact. Only the
          # user-facing application name is changed.
          $brandFile = Join-Path "${{ env.SOURCE_DIR }}" "NEXTCLOUD.cmake"
          $brandContent = Get-Content -LiteralPath $brandFile -Raw
          $brandContent = $brandContent.Replace(
            'set( APPLICATION_NAME       "Nextcloud" )',
            'set( APPLICATION_NAME       "예지솔루션 문서함" )'
          )
          $brandContent = $brandContent.Replace(
            'option( BUILD_UPDATER "Build updater" ON )',
            'option( BUILD_UPDATER "Build updater" OFF )'
          )
          if (-not $brandContent.Contains('option( BUILD_UPDATER "Build updater" OFF )')) {
            throw "Could not disable the desktop client updater."
          }
          $brandContent | Set-Content -LiteralPath $brandFile -Encoding utf8NoBOM

          # The application version can include a Craft build suffix while the
          # VFS plugin metadata contains only x.y.z. Compare the numeric version
          # so plugins produced by this same source build load correctly.
          $vfsFile = Join-Path "${{ env.SOURCE_DIR }}" "src\common\vfs.cpp"
          $vfsContent = Get-Content -LiteralPath $vfsFile -Raw
          $vfsContent = $vfsContent.Replace(
            '#include <QLoggingCategory>',
            "#include <QLoggingCategory>`r`n#include <QVersionNumber>"
          )
          $versionCheckNeedle = @(
            '    if (metadata[QStringLiteral("version")].toString() != QStringLiteral(MIRALL_VERSION_STRING)) {'
            '        qCWarning(lcPlugin) << "Plugin has wrong version" << loader.fileName() << metadata[QStringLiteral("version")];'
            '        return false;'
            '    }'
          ) -join "`n"
          $versionCheckReplacement = @(
            '    const auto pluginVersionString = metadata[QStringLiteral("version")].toString();'
            '    const auto pluginVersion = QVersionNumber::fromString(pluginVersionString);'
            '    const auto applicationVersion = QVersionNumber::fromString(QStringLiteral(MIRALL_VERSION_STRING));'
            '    if (pluginVersion.isNull() || applicationVersion.isNull() || pluginVersion != applicationVersion) {'
            '        qCWarning(lcPlugin) << "Plugin has wrong version" << loader.fileName() << pluginVersionString'
            '                            << "expected" << QStringLiteral(MIRALL_VERSION_STRING);'
            '        return false;'
            '    }'
          ) -join "`n"
          $vfsContent = $vfsContent.Replace($versionCheckNeedle, $versionCheckReplacement)
          if (-not $vfsContent.Contains('QVersionNumber::fromString(pluginVersionString)')) {
            $vfsContent = $vfsContent.Replace(
              $versionCheckNeedle.Replace("`n", "`r`n"),
              $versionCheckReplacement.Replace("`n", "`r`n")
            )
          }
          if (-not $vfsContent.Contains('QVersionNumber::fromString(pluginVersionString)')) {
            throw "Could not patch the VFS plugin version check."
          }
          $vfsContent | Set-Content -LiteralPath $vfsFile -Encoding utf8NoBOM

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install wixtoolset nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $inkscapeDir = 'C:\Program Files\Inkscape\bin'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install inkscape --yes --no-progress
            if ((Test-Path (Join-Path $inkscapeDir 'inkscape.exe'))) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          if (-not (Test-Path (Join-Path $inkscapeDir 'inkscape.exe'))) {
            throw 'Inkscape was not installed after three attempts.'
          }
          $inkscapeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure KDE Craft
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
            python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Build branded client
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c --src-dir "${{ env.SOURCE_DIR }}" nextcloud-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create deployable application image
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}"
          $blueprint = Get-ChildItem $root -Recurse -Filter nextcloud-client.py |
            Where-Object { $_.FullName -match 'blueprints' } |
            Select-Object -First 1
          if (-not $blueprint) { throw "Could not locate the Nextcloud Craft blueprint." }

          $content = Get-Content $blueprint.FullName -Raw
          if ($content -notmatch '(?m)^import os\s*$') {
            $content = "import os`r`n" + $content
          }
          $blueprintNeedle = '        self.defines["company"] = "Nextcloud GmbH"'
          $blueprintReplacement = @(
            '        self.defines["company"] = "Nextcloud GmbH"'
            '        self.defines["productname"] = "예지솔루션 문서함"'
            '        self.defines["launchExecutable"] = r"bin\nextcloud.exe"'
            '        self.scriptname = os.path.join(os.environ["GITHUB_WORKSPACE"], "craft-packager-source", "bin", "Packager", "Nsis", "NullsoftInstaller.nsi")'
          ) -join "`r`n"
          $content = $content.Replace($blueprintNeedle, $blueprintReplacement)
          if (-not $content.Contains('self.defines["productname"] = "예지솔루션 문서함"')) { throw "Could not configure the display name." }
          Set-Content $blueprint.FullName $content -Encoding utf8

          # Craft's generic NSIS wrapper creates only a Start-menu shortcut and
          # has no finish-page launcher. Preserve the official executable/icon,
          # while adding the expected desktop shortcut and Run option.
          $packagerSource = "${{ github.workspace }}\craft-packager-source"
          git clone --quiet https://github.com/nextcloud/craft.git $packagerSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $packagerSource checkout --quiet 6d812696a6aa025dc3c545d8feb954f23be9446e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisTemplate = Join-Path $packagerSource "bin\Packager\Nsis\NullsoftInstaller.nsi"
          $templateContent = Get-Content $nsisTemplate -Raw
          $templateContent = $templateContent.Replace(
            '!define MULTIUSER_INSTALLMODE_INSTDIR "@{productname}"',
            '!define MULTIUSER_INSTALLMODE_INSTDIR "Nextcloud"'
          )
          $finishReplacement = @(
            '!define MUI_FINISHPAGE_RUN "$INSTDIR\@{launchExecutable}"'
            '!define MUI_FINISHPAGE_RUN_TEXT "Run @{productname}"'
            '!insertmacro MUI_PAGE_FINISH'
          ) -join "`r`n"
          $templateContent = $templateContent.Replace('!insertmacro MUI_PAGE_FINISH', $finishReplacement)
          $desktopShortcut = @(
            '@{shortcuts}'
            'Section "Desktop shortcut"'
            '  ; Remove shortcuts and autostart entries left by an existing official Nextcloud installation.'
            '  SetShellVarContext current'
            '  Delete "$DESKTOP\Nextcloud.lnk"'
            '  RMDir /r "$SMPROGRAMS\Nextcloud"'
            '  DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Nextcloud"'
            '  SetShellVarContext all'
            '  Delete "$DESKTOP\Nextcloud.lnk"'
            '  RMDir /r "$SMPROGRAMS\Nextcloud"'
            '  SetShellVarContext current'
            '  CreateShortCut "$DESKTOP\@{productname}.lnk" "$INSTDIR\@{launchExecutable}"'
            'SectionEnd'
          ) -join "`r`n"
          $templateContent = $templateContent.Replace('@{shortcuts}', $desktopShortcut)
          $uninstallShortcuts = @(
            'SetShellVarContext current'
            'Delete "$DESKTOP\@{productname}.lnk"'
            'SetShellVarContext all'
            'Delete "$DESKTOP\@{productname}.lnk"'
            'SetShellVarContext current'
            '@{uninstallFiles}'
          ) -join "`r`n"
          $templateContent = $templateContent.Replace('@{uninstallFiles}', $uninstallShortcuts)
          # Older official/previous MSI builds can leave a GUID-named entry in
          # Windows "Installed apps". Remove only entries whose DisplayName is
          # exactly "Nextcloud"; user configuration and synced files are not touched.
          $legacyAppMacro = @(
            '!macro RemoveLegacyNextcloudApp root view'
            '  SetRegView ${view}'
            '  StrCpy $0 0'
            'legacy_nextcloud_loop_${root}_${view}:'
            '  EnumRegKey $1 ${root} "Software\Microsoft\Windows\CurrentVersion\Uninstall" $0'
            '  StrCmp $1 "" legacy_nextcloud_done_${root}_${view}'
            '  ReadRegStr $2 ${root} "Software\Microsoft\Windows\CurrentVersion\Uninstall\$1" "DisplayName"'
            '  StrCmp $2 "Nextcloud" 0 legacy_nextcloud_next_${root}_${view}'
            '  DeleteRegKey ${root} "Software\Microsoft\Windows\CurrentVersion\Uninstall\$1"'
            '  Goto legacy_nextcloud_loop_${root}_${view}'
            'legacy_nextcloud_next_${root}_${view}:'
            '  IntOp $0 $0 + 1'
            '  Goto legacy_nextcloud_loop_${root}_${view}'
            'legacy_nextcloud_done_${root}_${view}:'
            '!macroend'
            ''
          ) -join "`r`n"
          $templateContent = $templateContent.Replace('Function SnoreWinVer', $legacyAppMacro + 'Function SnoreWinVer')
          $oldUninstaller = '  ExecWait ''"$MultiUser.InstDir\uninstall.exe" /S _?=$MultiUser.InstDir'''
          $legacyAppCalls = @(
            $oldUninstaller
            '  !insertmacro RemoveLegacyNextcloudApp HKCU 64'
            '  !insertmacro RemoveLegacyNextcloudApp HKLM 64'
            '  !insertmacro RemoveLegacyNextcloudApp HKCU 32'
            '  !insertmacro RemoveLegacyNextcloudApp HKLM 32'
            '  SetRegView 64'
          ) -join "`r`n"
          $templateContent = $templateContent.Replace($oldUninstaller, $legacyAppCalls)
          if (-not $templateContent.Contains('MUI_FINISHPAGE_RUN "$INSTDIR\@{launchExecutable}"')) {
            throw "Could not add the finish-page launcher."
          }
          if (-not $templateContent.Contains('$DESKTOP\@{productname}.lnk')) { throw "Could not add the desktop shortcut." }
          if (-not $templateContent.Contains('Delete "$DESKTOP\Nextcloud.lnk"')) { throw "Could not add legacy shortcut cleanup." }
          if (-not $templateContent.Contains('RemoveLegacyNextcloudApp HKLM 64')) { throw "Could not add legacy app cleanup." }
          # Craft writes the configured NSIS script as UTF-8. Keep a BOM in
          # the source template so makensis detects Korean text as Unicode.
          [System.IO.File]::WriteAllText(
            $nsisTemplate,
            $templateContent,
            [System.Text.UTF8Encoding]::new($true)
          )

          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c --src-dir "${{ env.SOURCE_DIR }}" --package nextcloud-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows EXE installer
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}"
          New-Item -ItemType Directory -Force "${{ github.workspace }}\dist" | Out-Null
          $installer = Get-ChildItem (Join-Path $root 'tmp') -Filter '*.exe' |
            Where-Object { $_.Name -match 'nextcloud-client.*windows.*x86_64' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "Windows EXE installer was not created." }
          Copy-Item $installer.FullName "${{ github.workspace }}\dist\YEJI-Solution-Setup-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: YEJI-Solution-Windows-x64
          path: dist/YEJI-Solution-Setup-x64.exe
          if-no-files-found: error
