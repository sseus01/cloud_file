name: Build YEJI SOLUTION Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\source\craftmaster.ini
      SOURCE_DIR: ${{ github.workspace }}\source
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Expand branded source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "${{ github.workspace }}\YEJI-Solution-Nextcloud-Client-Source-v34.0.1.zip" -DestinationPath "${{ env.SOURCE_DIR }}"
          if (-not (Test-Path "${{ env.SOURCE_DIR }}\NEXTCLOUD.cmake")) {
            throw "The branded source archive is invalid."
          }
          # Theme code still references this constant even when the updater is
          # disabled. Keep updates disabled, but provide the compile-time URL.
          $brandFile = Join-Path "${{ env.SOURCE_DIR }}" "NEXTCLOUD.cmake"
          (Get-Content -LiteralPath $brandFile -Raw).Replace(
            'set( APPLICATION_UPDATE_URL "" CACHE STRING "URL for updater" )',
            'set( APPLICATION_UPDATE_URL "https://docs.ye-ji.com" CACHE STRING "URL for updater" )'
          ) | Set-Content -LiteralPath $brandFile -Encoding utf8NoBOM
          $cmakeFile = Join-Path "${{ env.SOURCE_DIR }}" "CMakeLists.txt"
          (Get-Content -LiteralPath $cmakeFile -Raw).Replace(
            'option(BUILD_TESTING "BUILD_TESTING" ON)',
            'option(BUILD_TESTING "BUILD_TESTING" OFF)'
          ) | Set-Content -LiteralPath $cmakeFile -Encoding utf8NoBOM
          # ZIP timestamps have no timezone. Normalize them so Ninja does not
          # interpret Korean-local timestamps as files from the future.
          $stableTime = (Get-Date).AddMinutes(-5)
          Get-ChildItem -LiteralPath "${{ env.SOURCE_DIR }}" -Recurse -Force |
            ForEach-Object { $_.LastWriteTime = $stableTime }

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install wixtoolset nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $inkscapeDir = 'C:\Program Files\Inkscape\bin'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install inkscape --yes --no-progress
            if ((Test-Path (Join-Path $inkscapeDir 'inkscape.exe'))) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          if (-not (Test-Path (Join-Path $inkscapeDir 'inkscape.exe'))) {
            throw 'Inkscape was not installed after three attempts.'
          }
          $inkscapeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure KDE Craft
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
            python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Build branded client
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c --src-dir "${{ env.SOURCE_DIR }}" nextcloud-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create deployable application image
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}"
          $blueprint = Get-ChildItem $root -Recurse -Filter nextcloud-client.py |
            Where-Object { $_.FullName -match 'blueprints' } |
            Select-Object -First 1
          if (-not $blueprint) { throw "Could not locate the Nextcloud Craft blueprint." }

          $content = Get-Content $blueprint.FullName -Raw
          if ($content -notmatch '(?m)^import os\s*$') {
            $content = "import os`r`n" + $content
          }
          $content = $content.Replace('self.defines["appname"] = "nextcloud"', 'self.defines["appname"] = "yeji-docs"')
          $content = $content.Replace('self.defines["company"] = "Nextcloud GmbH"', 'self.defines["company"] = "YEJI SOLUTION"')
          $content = $content.Replace('self.applicationExecutable = "nextcloud"', 'self.applicationExecutable = "yeji-docs"')
          Set-Content $blueprint.FullName $content -Encoding utf8

          $blacklist = Join-Path $blueprint.Directory.FullName 'blacklist.txt'
          $blacklistContent = Get-Content $blacklist -Raw
          $blacklistContent = $blacklistContent.Replace('(?!(nextcloud|nextcloudcmd|QtWebEngineProcess))', '(?!(yeji-docs|nextcloudcmd|QtWebEngineProcess))')
          Set-Content $blacklist $blacklistContent -Encoding utf8

          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c --src-dir "${{ env.SOURCE_DIR }}" --package nextcloud-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}"
          $archive = Get-ChildItem $root -Directory -Recurse |
            Where-Object { $_.Name -eq 'archive' -and (Test-Path (Join-Path $_.FullName 'bin\yeji-docs.exe')) } |
            Select-Object -First 1
          if (-not $archive) { throw "Could not locate the packaged application image." }

          $makeMsi = Get-ChildItem $root -Recurse -Filter make-msi.bat |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'Nextcloud.wxs') } |
            Select-Object -First 1
          if (-not $makeMsi) { throw "Could not locate the generated MSI scripts." }

          $wixDir = Get-ChildItem ${env:ProgramFiles(x86)} -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wixDir) { throw "WiX Toolset v3 was not found." }
          $env:WIX = $wixDir.FullName
          # Hosted runners do not include uuidgen. Preserve a generated
          # ProductCode for make-msi.bat when its uuidgen loop returns nothing.
          $env:PRODUCTCODE = ([guid]::NewGuid().ToString("B").ToUpperInvariant())

          Push-Location $makeMsi.Directory.FullName
          & $makeMsi.FullName $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          New-Item -ItemType Directory -Force "${{ github.workspace }}\dist" | Out-Null
          $msi = Get-ChildItem $makeMsi.Directory.FullName -Filter '*.msi' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) { throw "MSI output was not created." }
          Copy-Item $msi.FullName "${{ github.workspace }}\dist\YEJI-Solution-Setup-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: YEJI-Solution-Windows-x64
          path: dist/YEJI-Solution-Setup-x64.msi
          if-no-files-found: error
